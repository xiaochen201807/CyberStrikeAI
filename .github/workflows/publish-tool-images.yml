name: Publish CyberStrikeAI images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cyberstrike-ai
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/control/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=cyberstrike-control-publish
          cache-to: type=gha,mode=max,scope=cyberstrike-control-publish

  publish-family-runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        family: [recon, web, identity, binary-forensics, cloud, exploitation, external-intel, utility]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cyberstrike-tool-runtime-${{ matrix.family }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/tools/services/family-mcp/Dockerfile
          build-args: |
            TOOL_FAMILY=${{ matrix.family }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=cyberstrike-runtime-publish-${{ matrix.family }}
          cache-to: type=gha,mode=max,scope=cyberstrike-runtime-publish-${{ matrix.family }}

  publish-fixed-adapters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: nuclei-mcp
            base_image: projectdiscovery/nuclei:v3.4.10@sha256:aeb5ea2db32a252b8135707d2ad0e89b90e19a18ea7816d38759bc51efb46b97
          - name: zap-mcp
            base_image: ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cyberstrike-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/tools/services/tool-mcp/Dockerfile
          build-args: |
            TOOL_BASE_IMAGE=${{ matrix.base_image }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=cyberstrike-${{ matrix.name }}-publish
          cache-to: type=gha,mode=max,scope=cyberstrike-${{ matrix.name }}-publish

  smoke-published-stack:
    name: Smoke test published single-VM stack
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-control, publish-family-runtimes, publish-fixed-adapters]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Resolve immutable image references
        id: images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          digest_for() {
            docker buildx imagetools inspect "$1" | awk '/^Digest:/ { print $2; exit }'
          }
          image_ref() {
            image="$1"
            ref="ghcr.io/${OWNER}/${image}:${RELEASE_TAG}"
            printf '%s@%s' "$ref" "$(digest_for "$ref")"
          }
          {
            echo "control=$(image_ref cyberstrike-ai)"
            echo "recon=$(image_ref cyberstrike-tool-runtime-recon)"
            echo "web=$(image_ref cyberstrike-tool-runtime-web)"
          } >> "$GITHUB_OUTPUT"
      - name: Start and verify the published stack
        env:
          CYBERSTRIKE_IMAGE: ${{ steps.images.outputs.control }}
          RECON_IMAGE: ${{ steps.images.outputs.recon }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          TOOL_MCP_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          TOOL_ALLOWED_HOSTS: example.com
          CYBERSTRIKE_PLATFORM: linux/amd64
          BUILD_IMAGES: "0"
          RUNTIME_PROFILES: runtime-recon runtime-web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/tools/data
          cat > deploy/tools/.env <<EOF
          CYBERSTRIKE_PLATFORM=${CYBERSTRIKE_PLATFORM}
          CYBERSTRIKE_IMAGE=${CYBERSTRIKE_IMAGE}
          RECON_IMAGE=${RECON_IMAGE}
          WEB_IMAGE=${WEB_IMAGE}
          TOOL_MCP_TOKEN=${TOOL_MCP_TOKEN}
          TOOL_ALLOWED_HOSTS=${TOOL_ALLOWED_HOSTS}
          TOOLS_COMPOSE_PROJECT=cyberstrike-tools
          TOOLS_EGRESS_NETWORK=cyberstrike-tools-egress
          CYBERSTRIKE_CONTROL_NETWORK=cyberstrike-control
          EOF
          trap 'docker compose --env-file deploy/tools/.env -f deploy/tools/docker-compose.runtime.yml --profile runtime-recon --profile runtime-web down --volumes || true; docker compose --env-file deploy/tools/.env -f deploy/control/docker-compose.yml down --volumes || true' EXIT
          ./deploy/start-stack.sh
          curl -kfsS https://127.0.0.1:8080/healthz
          curl -kfsS https://127.0.0.1:8080/readyz
