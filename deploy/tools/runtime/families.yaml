schema_version: 1
name: cyberstrike-tool-runtimes
base_image: kalilinux/kali-rolling@sha256:c717f201f29a7e0a9126c0d51bd08aa7194ac82f53c57314339182f92b0b1585
# The image names are local defaults. A production .env should replace each
# one with the immutable GHCR digest produced by publish-tool-images.yml.
# Published family images currently target linux/amd64; arm64 support requires
# a separate validation of every installer and upstream binary.
families:
  recon:
    service: runtime-recon-mcp
    compose_profile: runtime-recon
    image: cyberstrike-tool-runtime:recon
  web:
    service: runtime-web-mcp
    compose_profile: runtime-web
    image: cyberstrike-tool-runtime:web
  identity:
    service: runtime-identity-mcp
    compose_profile: runtime-identity
    image: cyberstrike-tool-runtime:identity
  binary-forensics:
    service: runtime-binary-mcp
    compose_profile: runtime-binary
    image: cyberstrike-tool-runtime:binary-forensics
  cloud:
    service: runtime-cloud-mcp
    compose_profile: runtime-cloud
    image: cyberstrike-tool-runtime:cloud
  exploitation:
    service: runtime-exploitation-mcp
    compose_profile: runtime-exploitation
    image: cyberstrike-tool-runtime:exploitation
  external-intel:
    service: runtime-external-intel-mcp
    compose_profile: runtime-external-intel
    image: cyberstrike-tool-runtime:external-intel
  utility:
    service: runtime-utility-mcp
    compose_profile: runtime-utility
    image: cyberstrike-tool-runtime:utility
